<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>选择记录发送给AI</title><style>body{font-family:Arial;margin:20px;background:#f5f5f5}.container{max-width:800px;margin:auto;background:white;padding:20px;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd}th{background:#f0f0f0}button{padding:10px 20px;background:#1890ff;color:white;border:none;border-radius:4px;cursor:pointer}</style></head><body><div class="container"><h2>选择要分析的课堂记录</h2><form method="post" action="{{ url_for('admin.admin') }}"><input type="hidden" name="action" value="send_selected_ai"><table><tr><th>选择</th><th>时间</th><th>学生</th><th>行为</th></tr>{% for rec in records %}<tr><td><input type="checkbox" name="selected" value="{{ rec.student }}:{{ rec.index }}"></td><td>{{ rec.time }}</td><td>{{ rec.name }}</td><td>{{ rec.action }}</td></tr>{% endfor %}</table><button type="submit" style="margin-top:15px;">发送选中的记录给AI</button></form><a href="{{ url_for('admin.admin') }}">返回管理面板</a></div>{% include 'broadcast_check.html' %}</body></html>
