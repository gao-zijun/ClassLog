<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统错误 - ClassLog</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 700px; width: 90%; }
        h1 { color: #dc2626; margin-bottom: 16px; }
        p { color: #475569; margin-bottom: 12px; }
        pre { background: #f8fafc; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 12px; color: #334155; max-height: 300px; }
        a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <h1>⚠️ 系统出现错误</h1>
        <p><strong>错误信息：</strong>{{ error }}</p>
        <p>该错误已被记录，五级管理员可登录系统查看详细信息。</p>
        <pre>{{ traceback }}</pre>
        <p><a href="/">返回首页</a></p>
    </div>
</body>
</html>
