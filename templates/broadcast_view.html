<!DOCTYPE html><html><head><title>屏幕广播</title><meta charset="utf-8"><style>body{margin:0;padding:0;overflow:hidden;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Microsoft YaHei',sans-serif}.container{background:white;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.5);padding:40px;max-width:600px;text-align:center}.sender{color:#555;font-size:14px;margin-bottom:20px}.message{font-size:28px;color:#d32f2f;margin-bottom:30px}.close-hint{color:#999;font-size:12px}</style></head><body><div class="container"><div class="sender">广播来自：<strong>{{ sender }}</strong></div><div class="message">{{ message }}</div><div class="close-hint">此页面将在 <span id="countdown">5</span> 秒后自动关闭</div></div><script>var s=5;var c=document.getElementById('countdown');var t=setInterval(function(){s--;c.textContent=s;if(s<=0){clearInterval(t);window.location.href='{{ url_for("auth.login") }}';}},1000);</script></body></html>
