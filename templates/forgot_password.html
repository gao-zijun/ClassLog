<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>忘记密码 - ClassLog</title>
    <style>
        :root{--primary:#6366f1;--primary-dark:#4f46e5;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0}
        body{font-family:'Inter','Segoe UI','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2)}
        .container{background:white;padding:40px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.2);width:100%;max-width:420px}
        h2{text-align:center;color:var(--primary);margin-bottom:24px}
        .error{color:#ef4444;margin-bottom:12px;text-align:center}
        .msg{color:#10b981;margin-bottom:12px;text-align:center}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:6px;font-weight:600;color:var(--text-light)}
        input,select,textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px}
        .btn{width:100%;padding:12px;background:var(--primary);color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
        .btn:hover{background:var(--primary-dark)}
        .radio-group{display:flex;gap:20px;align-items:center;margin-bottom:12px}
        .radio-group label{font-weight:normal}
        a{color:var(--primary);text-decoration:none}
    </style>
</head>
<body>
    <div class="container">
        {% if step == '1' %}
            <h2>🔑 忘记密码</h2>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="POST">
                <input type="hidden" name="step" value="1">
                <div class="form-group"><label>请输入您的用户名（二级及以上）</label><input type="text" name="username" required autofocus></div>
                <button type="submit" class="btn">下一步</button>
            </form>
        {% elif step == '2' %}
            <h2>重置密码 - {{ username }}</h2>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="POST">
                <input type="hidden" name="step" value="2"><input type="hidden" name="username" value="{{ username }}">
                <div class="radio-group"><label><input type="radio" name="action" value="submit_key" checked> 使用恢复密钥</label><label><input type="radio" name="action" value="submit_apply"> 提交申请</label></div>
                <div id="keyInput" class="form-group"><label>恢复密钥（请向管理员索取）</label><input type="text" name="reset_key" placeholder="输入8位密钥"></div>
                <div id="applyHint" class="form-group" style="display:none;color:var(--text-light);"><p>提交后，四级以上管理员将收到申请，审批通过后密码将被重置为 12345678。</p></div>
                <button type="submit" class="btn">提交</button>
            </form>
        {% elif step == 'success' %}
            <h2>操作成功</h2>
            <div class="msg">{{ msg }}</div>
            <p style="text-align:center;"><a href="{{ url_for('auth.login') }}">返回登录页</a></p>
        {% endif %}
        <p style="text-align:center;margin-top:20px;"><a href="{{ url_for('auth.login') }}">← 返回登录</a></p>
    </div>
    <script>
        const radios = document.querySelectorAll('input[name="action"]');
        const keyInput = document.getElementById('keyInput');
        const applyHint = document.getElementById('applyHint');
        function toggle() {
            if (document.querySelector('input[name="action"]:checked').value === 'submit_key') { keyInput.style.display='block'; applyHint.style.display='none'; }
            else { keyInput.style.display='none'; applyHint.style.display='block'; }
        }
        radios.forEach(r => r.addEventListener('change', toggle));
        toggle();
    </script>
</body>
</html>
