{% extends "base.html" %}
{% block title %}选择班级 - ClassLog{% endblock %}
{% block page_title %}📚 选择你的班级{% endblock %}

{% block content %}
<script type="application/json" id="classData">{{ all_classes | tojson }}</script>
<script type="application/json" id="existingData">{{ existing | tojson }}</script>

<div class="card">
    <h3>请选择你所教的班级</h3>
    <p style="color:var(--text-light);">前两个班级立即生效，添加更多班级需要管理员审批。</p>
    <form method="POST">
        <div id="class-list">
            <div class="form-group">
                <label>班级 1</label>
                <select name="classes" class="class-select"></select>
            </div>
            <div class="form-group">
                <label>班级 2</label>
                <select name="classes" class="class-select"></select>
            </div>
        </div>

        <button type="button" class="btn" id="add-more" style="margin-top:12px;">➕ 添加更多班级</button>

        <div class="form-group" style="margin-top:20px;">
            <label>您的真实姓名</label>
            <input type="text" name="real_name" value="{{ current_name }}" placeholder="请输入您的姓名" required>
        </div>

        <button type="submit" class="btn" style="margin-top:16px;">💾 保存</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 从后端注入的 JSON 读取班级列表和已选班级
    var classData = JSON.parse(document.getElementById('classData').textContent);
    var existingData = JSON.parse(document.getElementById('existingData').textContent);

    function buildOptions(selectedValue) {
        var html = '<option value="">-- 不选择 --</option>';
        classData.forEach(function(cls) {
            var selected = (selectedValue === cls) ? ' selected' : '';
            html += '<option value="' + cls + '"' + selected + '>' + cls + '</option>';
        });
        return html;
    }

    // 初始化前两个下拉框
    var selects = document.querySelectorAll('.class-select');
    selects.forEach(function(sel, idx) {
        var current = existingData[idx] || '';
        sel.innerHTML = buildOptions(current);
    });

    // 添加更多班级
    document.getElementById('add-more').addEventListener('click', function() {
        var classList = document.getElementById('class-list');
        var count = classList.querySelectorAll('select').length + 1;
        var div = document.createElement('div');
        div.className = 'form-group';
        div.innerHTML = '<label>班级 ' + count + '</label>' +
                        '<select name="classes" class="class-select">' + buildOptions('') + '</select>';
        classList.appendChild(div);
    });
</script>
{% endblock %}
