{% extends "simple_base.html" %}
{% block title %}注册 - ClassLog{% endblock %}
{% block content %}
<h2>📝 注册</h2>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
<form method="POST">
    <div class="form-group">
        <label>角色</label>
        <select name="role" id="roleSelect" onchange="toggleFields()">
            <option value="student">学生</option>
            <option value="teacher">教师</option>
        </select>
    </div>
    <div id="studentFields">
        <div style="background:#e0f2fe;border-left:4px solid #0ea5e9;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;color:#0c4a6e;">
            💡 <strong>为什么需要这些信息？</strong><br>
            • 你的课堂行为记录会关联到对应教师<br>
            • 填写真实姓名以便教师准确识别<br>
            • 提交后需由教师审批，通过后方可登录
        </div>
        <div class="form-group"><label>选择教师</label><select name="teacher" required><option value="">-- 请选择 --</option>{% for uname, info in teachers.items() %}<option value="{{ uname }}">{{ info.name or uname }} ({{ uname }})</option>{% endfor %}</select></div>
        <div class="form-group"><label>你的姓名</label><input type="text" name="student_name" placeholder="输入真实姓名" required></div>
    </div>
    <div id="teacherFields" style="display:none;">
        <div class="form-group"><label>用户名</label><input type="text" name="username" placeholder="登录用户名"></div>
        <div class="form-group"><label>密码（8-16位）</label><input type="password" name="password"></div>
        <div class="form-group"><label>班级</label><input type="text" name="class_name" placeholder="所教班级"></div>
    </div>
    <button type="submit" class="btn">提交</button>
</form>
<p style="text-align:center;margin-top:16px;"><a href="{{ url_for('auth.login') }}">已有账号？登录</a></p>
<script>
    function toggleFields() {
        var role = document.getElementById('roleSelect').value;
        document.getElementById('studentFields').style.display = role === 'student' ? 'block' : 'none';
        document.getElementById('teacherFields').style.display = role === 'teacher' ? 'block' : 'none';
    }
</script>
{% endblock %}
