<style>
    /* ========== 全局加载遮罩 ========== */
    #global-loading {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255,255,255,0.7);
        z-index: 100000;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    #global-loading.show {
        display: flex;
    }
    .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .loading-text {
        margin-top: 12px;
        font-size: 14px;
        color: #475569;
    }

    /* ========== 广播飘窗 ========== */
    .broadcast-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:99998;animation:fadeIn 0.3s}
    .broadcast-toast{position:fixed;top:20px;right:20px;max-width:400px;width:calc(100% - 40px);background:#ffffff;border-left:4px solid #dc2626;box-shadow:0 10px 25px rgba(0,0,0,0.25);border-radius:8px;padding:16px 20px;z-index:99999;font-family:'Segoe UI','Microsoft YaHei',sans-serif;animation:slideIn 0.3s;word-wrap:break-word;overflow-wrap:break-word;white-space:normal}
    .broadcast-toast .toast-sender{margin-bottom:6px}
    .broadcast-toast .toast-message{font-weight:bold}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>

<!-- 全局加载遮罩 -->
<div id="global-loading">
    <div class="spinner"></div>
    <div class="loading-text">正在处理，请稍候...</div>
</div>

<script>
    // ========== 页面加载完成后隐藏加载遮罩 ==========
    window.addEventListener('load', function() {
        document.getElementById('global-loading').classList.remove('show');
    });

    // ========== 防止重复提交 ==========
    document.addEventListener('submit', function(e) {
        var form = e.target;
        // 显示加载遮罩
        document.getElementById('global-loading').classList.add('show');

        // 禁用提交按钮并修改文字
        var buttons = form.querySelectorAll('button[type="submit"], input[type="submit"]');
        buttons.forEach(function(btn) {
            if (!btn.disabled) {
                btn.disabled = true;
                // 保存原文字到 data 属性（如果还未保存）
                if (!btn.dataset.originalText) {
                    btn.dataset.originalText = btn.innerHTML;
                }
                // 修改按钮文字
                if (btn.tagName === 'BUTTON') {
                    btn.innerHTML = '⏳ 提交中...';
                } else {
                    btn.value = '提交中...';
                }
            }
        });
    });

    // ========== 广播飘窗 ==========
    var broadcastQueue=[],showing=false;
    function showNext(){if(!broadcastQueue.length){showing=false;return}showing=true;var bc=broadcastQueue.shift();
    var overlay=document.createElement('div');overlay.className='broadcast-overlay';document.body.appendChild(overlay);
    var toast=document.createElement('div');toast.className='broadcast-toast';toast.innerHTML='<div class="toast-sender">📢 广播来自：<strong>'+bc.sender+'</strong></div><div class="toast-message">'+bc.message+'</div>';
    document.body.appendChild(toast);
    var t=setTimeout(function(){dismiss(toast,overlay)},8000);toast._timer=t;toast._overlay=overlay}
    function dismiss(toast,overlay){if(!toast||toast._dismissed)return;toast._dismissed=true;clearTimeout(toast._timer);toast.style.opacity='0';if(overlay)overlay.style.opacity='0';setTimeout(function(){if(toast.parentNode)toast.parentNode.removeChild(toast);if(overlay&&overlay.parentNode)overlay.parentNode.removeChild(overlay);showNext()},500)}
    setInterval(function(){fetch('/api/check-broadcast').then(r=>r.json()).then(d=>{if(d.broadcast){broadcastQueue.push(d.broadcast);if(!showing)showNext()}}).catch(function(){})},1000);
    setInterval(function(){fetch('/api/heartbeat')},30000);
</script>
